<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPL Season 4 - Player Registration Card Template</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #030712;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }
    h1 {
      font-size: 20px;
      font-weight: 800;
      color: #f59e0b;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    p.subtitle {
      font-size: 13px;
      color: #9ca3af;
      margin-bottom: 20px;
      text-align: center;
    }
    .preview-container {
      max-width: 480px;
      width: 100%;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(245, 158, 11, 0.25), 0 0 0 1px rgba(245, 158, 11, 0.3);
      background: #071126;
      margin-bottom: 24px;
    }
    .preview-container img {
      width: 100%;
      height: auto;
      display: block;
    }
    .controls {
      display: flex;
      gap: 12px;
      max-width: 480px;
      width: 100%;
      justify-content: center;
    }
    .btn {
      flex: 1;
      padding: 12px 18px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #1e1002;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.4);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.6);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body>
  <h1>Goregaon Premier League Season 4</h1>
  <p class="subtitle">Official Player Auction Pool Registration Card Template</p>

  <div class="preview-container">
    <img src="template-player-card.png" alt="GPL Season 4 Player Registration Card Template" />
  </div>

  <div class="controls">
    <a href="template-player-card.png" download="GPL-Season4-Player-Card-Template.png" class="btn btn-primary">
      ⬇ Download Template Image
    </a>
  </div>
</body>
</html>
