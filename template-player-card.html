<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPL Season 4 - Official Player Auction Card Template</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #040814;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px;
    }
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    .header h1 {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #fbbf24;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .header p {
      font-size: 13px;
      color: #94a3b8;
    }
    .card-preview {
      max-width: 440px;
      width: 100%;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 25px 60px -15px rgba(245, 158, 11, 0.3), 0 0 0 1px rgba(245, 158, 11, 0.25);
      margin-bottom: 24px;
      background: #080e1c;
      transition: transform 0.3s ease;
    }
    .card-preview:hover {
      transform: translateY(-4px);
    }
    .card-preview img {
      width: 100%;
      height: auto;
      display: block;
    }
    .actions {
      display: flex;
      gap: 12px;
      max-width: 440px;
      width: 100%;
    }
    .btn {
      flex: 1;
      padding: 14px 20px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 13px;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .btn-download {
      background: linear-gradient(135deg, #f59e0b 0%, #fbbf24 50%, #d97706 100%);
      color: #0b1120;
      box-shadow: 0 4px 18px rgba(245, 158, 11, 0.4);
    }
    .btn-download:hover {
      transform: scale(1.02);
      box-shadow: 0 6px 24px rgba(245, 158, 11, 0.6);
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>GPL Season 4 Player Card</h1>
    <p>Clean &amp; Professional Auction Pool Template</p>
  </div>

  <div class="card-preview">
    <img src="template-player-card.png" alt="GPL Season 4 Player Auction Card Template" />
  </div>

  <div class="actions">
    <a href="template-player-card.png" download="GPL4_Player_Card_Template.png" class="btn btn-download">
      ⬇ Download Template Image (PNG)
    </a>
  </div>
</body>
</html>
